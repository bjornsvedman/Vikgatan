services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: invoice-manager-postgres
    environment:
      POSTGRES_DB: invoice_manager
      POSTGRES_USER: invoice_manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice_manager -d invoice_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
